<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt Người Dùng - UrbanGarden</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-seedling"></i>
            <span>UrbanGarden</span>
        </div>
        <nav class="nav">
            <a href="index.html"><i class="fa-solid fa-house"></i> Tổng quan</a>
            <a href="vuon-cua-toi.html"><i class="fa-solid fa-plant-wilt"></i> Vườn của tôi</a>
            <a href="lich-cham-soc.html"><i class="fa-solid fa-calendar-days"></i> Lịch chăm sóc</a>
            <a href="cam-nang.html"><i class="fa-solid fa-book-open"></i> Cẩm nang</a>
            <a href="sao-luu.html"><i class="fa-solid fa-database"></i> Sao lưu</a>
        </nav>
        <div class="user-profile">
            <div class="notification-wrapper">
                <div class="notification-icon" id="notifBtn" title="Thông báo & Nhắc hẹn">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification-badge">2</span>
                </div>
            </div>
            <a href="dang-nhap.html" class="btn-login"><i class="fa-solid fa-user"></i> Đăng nhập</a>
        </div>
    </header>

    <main class="main-container">
        <section class="page-header-section" style="margin-bottom: 2rem;">
            <div>
                <h1>⚙️ Cài Đặt Người Dùng</h1>
                <p>Quản lý thông tin tài khoản và cấu hình hệ thống của bạn.</p>
            </div>
        </section>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
            <!-- Thẻ thông tin cá nhân -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-id-card text-green"></i> Hồ Sơ Cá Nhân</h2>
                </div>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profileName">Tên hiển thị</label>
                        <input type="text" id="profileName" required placeholder="Nhập tên của bạn...">
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email tài khoản</label>
                        <input type="email" id="profileEmail" disabled style="background-color: #f1f5f9; cursor: not-allowed;">
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi</button>
                </form>
            </div>

            <!-- Thẻ đổi mật khẩu -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-key text-orange"></i> Đổi Mật Khẩu</h2>
                </div>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="oldPassword">Mật khẩu hiện tại</label>
                        <input type="password" id="oldPassword" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Mật khẩu mới</label>
                        <input type="password" id="newPassword" required placeholder="Tối thiểu 6 ký tự...">
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-shield-halved"></i> Cập nhật mật khẩu</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
       
        // Tải dữ liệu người dùng từ localStorage khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
        const currentName = localStorage.getItem('currentUserName') || localStorage.getItem('registeredName') || '';
        const registeredEmail = localStorage.getItem('currentUserEmail') || localStorage.getItem('registeredEmail') || '';

        document.getElementById('profileName').value = currentName;
        document.getElementById('profileEmail').value = registeredEmail;
    });

        // Xử lý đổi tên hiển thị
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newName = document.getElementById('profileName').value.trim();
            if (newName) {
                localStorage.setItem('currentUserName', newName);
                localStorage.setItem('registeredName', newName);
                alert('Đã cập nhật tên thành công!');
                location.reload();
            }
        });

        // Xử lý đổi mật khẩu
        document.getElementById('passwordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const savedPass = localStorage.getItem('registeredPassword');

            if (savedPass && oldPass !== savedPass) {
                alert('Mật khẩu hiện tại không đúng!');
                return;
            }

            if (newPass.length < 6) {
                alert('Mật khẩu mới cần tối thiểu 6 ký tự!');
                return;
            }

            localStorage.setItem('registeredPassword', newPass);
            alert('Đổi mật khẩu thành công!');
            document.getElementById('passwordForm').reset();
        });
    </script>
</body>
</html>
